services:
  paseo:
    image: paseo-with-agents
    build: .
    container_name: paseo
    restart: unless-stopped
    ports:
      - "6767:6767"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PASEO_PASSWORD: "${PASEO_PASSWORD}"
    volumes:
      - ./paseo-home:/home/paseo
      - /home/lance/git:/home/paseo/git
      - /home/lance/.ssh:/home/paseo/.ssh:ro

  paseo-alex:
    image: paseo-with-agents
    build: .
    container_name: paseo-alex
    restart: unless-stopped
    ports:
      - "6768:6767"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PASEO_PASSWORD: "${ALEX_PASSWORD}"
    volumes:
      - paseo-alex-home:/home/paseo

volumes:
  paseo-alex-home:
